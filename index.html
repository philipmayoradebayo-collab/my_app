
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daybook — To-Do</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- Header -->
        <header class="header">
            <p class="eyebrow">YOUR PERSONAL SPACE</p>

            <h1 class="title">To-Do App</h1>

            <p class="subtitle">
                A running list, kept honest
            </p>
        </header>

        <!-- Add Task Form -->
        <form id="task-form" class="entry-row">

            <span id="next-index" class="entry-index">01</span>

            <input
                type="text"
                id="task-input"
                class="entry-input"
                placeholder="Write a task and press Enter"
                autocomplete="off"
                required
            >

            <button type="submit" class="add-btn">
                Add <span aria-hidden="true">+</span>
            </button>

        </form>

        <!-- Task Filters -->
        <nav id="filter-row" class="filter-row" aria-label="Task filters">

            <button
                type="button"
                class="filter-btn is-active"
                data-filter="all"
                aria-pressed="true"
            >
                All
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="active"
                aria-pressed="false"
            >
                Active
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="completed"
                aria-pressed="false"
            >
                Completed
            </button>

        </nav>

        <!-- Task List -->
        <section class="list-section">

            <ul id="task-list" class="task-list"></ul>

            <p id="empty-state" class="empty-state">
                Nothing here yet. Add your first task above.
            </p>

        </section>

        <!-- Footer -->
        <footer class="footer">

            <span id="task-count" class="task-count">
                0 tasks
            </span>

            <button
                type="button"
                id="clear-completed"
                class="clear-btn"
            >
                Clear completed
            </button>

        </footer>

    </main>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
